default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PG_AUTH_MODE"] == "iam" ? "" : ENV.fetch("PGPASSWORD", "") %>

development:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "daymark_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("PGTESTDATABASE", "daymark_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "daymark_production") %>
